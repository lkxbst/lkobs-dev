name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, gd, zip, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment and SQLite database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

      - name: Run Larastan (PHPStan level 8)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run Pest tests
        run: ./vendor/bin/pest

  frontend:
    name: Frontend (Astro + Playwright + Lighthouse)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint and Prettier
        run: npm run lint

      - name: Run Astro Check
        run: npm run check

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build static site with fixture
        env:
          USE_FIXTURE: 'true'
          SITE_URL: 'https://luankobs.dev'
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E and Axe accessibility tests
        run: npm run test:e2e

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x collect --config=.lighthouserc.json && npx @lhci/cli@0.15.x assert --config=.lighthouserc.json
