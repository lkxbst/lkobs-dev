name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  repository_dispatch:
    types: [content-updated, portfolio-rebuild]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          USE_FIXTURE: ${{ env.PRODUCTION_API_URL == '' && 'true' || 'false' }}
          API_URL: ${{ env.PRODUCTION_API_URL || 'http://localhost:8000' }}
          SITE_URL: ${{ env.PUBLIC_SITE_URL || 'https://luankobs.dev' }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME || 'luankobs-dev' }}
