name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  repository_dispatch:
    types: [portfolio-rebuild]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site from production API
        working-directory: frontend
        env:
          USE_FIXTURE: 'false'
          API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.luankobs.dev' }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://luankobs.dev' }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'luankobs-dev' }}
