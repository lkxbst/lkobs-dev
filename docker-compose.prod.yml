services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    container_name: kobs-prod-app
    restart: always
    stop_grace_period: 5s
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - sqlite_data:/var/www/html/database
      - storage_public:/var/www/html/storage/app/public
    networks:
      - kobs-prod-net

  web:
    image: nginx:1.27-alpine
    container_name: kobs-prod-web
    restart: always
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - storage_public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kobs-prod-net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    container_name: kobs-prod-queue
    restart: always
    stop_grace_period: 5s
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    volumes:
      - ./backend:/var/www/html
      - sqlite_data:/var/www/html/database
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      - app
    networks:
      - kobs-prod-net

volumes:
  sqlite_data:
  storage_public:

networks:
  kobs-prod-net:
    driver: bridge
